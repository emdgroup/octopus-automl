[project]
name = "octopus-automl"
description = "An Auto-ML framework optimized for small datasets"
authors = [
    {name = "Merck KGaA, Darmstadt, Germany"},
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt", "CONTRIBUTORS.md"]
requires-python =">=3.12,<3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
keywords = [
    "AutoML",
    "Small data",
    "Machine learning",
    "Explainable AI",
    "Interpretable ML"
]
dynamic = ['version']
dependencies = [
    "attrs>=25.3.0",
    "catboost>=1.2.8",
    "networkx>=3.5",
    "numpy>=2.2",
    "optuna>=4.5",
    "pandas>=2.3,<3",
    "ray>=2.52,<3",
    "rapidfuzz>=3.14",
    "scikit-learn>=1.7.0,<2",
    "shap>=0.51",
    "torch>=2.0,<3",
    "xgboost>=3.0",
    "fsspec>=2025.10.0",
    "universal_pathlib>=0.3.6",
    "pyarrow>=17.0.0",
]

[project.urls]
Homepage = "https://emdgroup.github.io/octopus-automl/"
Documentation = "https://emdgroup.github.io/octopus-automl/"
Changelog = "https://github.com/emdgroup/octopus-automl/releases"
GitHub = "https://github.com/emdgroup/octopus-automl/"
Issues = "https://github.com/emdgroup/octopus-automl/issues/"

# DEV TOOLS NOTE: The versions of all dev tools should be consistent everywhere
# (pre-commit, environment.yml, requirements.txt, pyproject.toml, ...)
# AUDIT NOTE: The marked packages are secondary dependencies but their versions are
# set explicitly because the otherwise installed default versions have been flagged
# for vulnerabilities by pip-audit
[project.optional-dependencies]
boruta = [
    "boruta>=0.4.3",
]
autogluon = [
    "autogluon.tabular[all]>=1.5,<1.6",
    "bokeh>=3.8", # missed and required by ag=1.4
    "tokenizers>=0.13.0", # Override old tokenizers, use version with Python 3.12 wheels
]
survival = [
    "lifelines>=0.29.0",
]

recommended = [
    "octopus-automl[autogluon]",
    "octopus-automl[boruta]",
    "octopus-automl[survival]",
    "octopus-automl[examples]",
]

dev = [
    "octopus-automl[test]",
    "octopus-automl[lint]",
    "octopus-automl[docs]",
    "nbstripout>=0.8.2",
]
docs = [
    "octopus-automl[examples]", # docs cannot be built without running examples
    "octopus-automl[test]", # creating docs requires importing the package and all (even optional) dependencies
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.1",
    "mkdocstrings-python>=2.0.1",
    "mkdocs-gen-files>=0.6.0",
    "mkdocs-literate-nav>=0.6.2",
    "nbconvert>=7.16.6",
    "jupytext>=1.19.0",
]
examples = [
    "nbformat>=5.10",
    "nbconvert>=7.16.6",
    "notebook>=7.5.2",
    "ipywidgets>=8",
    "ipykernel>=7.1.0",
]
lint = [
    "flake8==7.3.0", # see DEV TOOLS NOTE
    "pre-commit==4.3.0", # see DEV TOOLS NOTE
    "pydoclint==0.7.3", # see DEV TOOLS NOTE
    "pyupgrade==3.21.0", # see DEV TOOLS NOTE
    "ruff==0.14.1", # see DEV TOOLS NOTE
    "licensecheck>=2025.1.0",
    # TYPE CHECKING NOTE: mypy runs as a local pre-commit hook in this environment,
    # so everything imported by the checked code (octopus, tests, examples, docs)
    # has to be installed here for mypy to see the real types.
    "mypy==2.4.1",
    "octopus-automl[recommended]",
    "joblib-stubs>=1.5.3.1.20260117,<1.6", # stubs must match the installed joblib version
    "pandas-stubs>=2.3.3.260113,<3", # stubs must match the installed pandas version
    "plotly-stubs>=0.1.4",
    "pyarrow-stubs>=20.0.0.20260819",
    "botocore-stubs>=1.43.123",
    "types-boto3-s3>=1.43.106",
    "scikit-learn-stubs>=0.0.3",
    "scipy-stubs[scipy]>=1.16.3.3", # the extra keeps the stubs in line with the installed scipy version
    "types-networkx>=3.6.1.20261031",
    "types-pytz>=2026.6.0.20261031",
    "types-jmespath>=1.1.0.20260724",
    "pytest>=9.2.0",
    "moto>=5.2.5",
    "mkdocs-gen-files>=0.6.1",
]
test = [
    "octopus-automl[recommended]",
    "octopus-automl[lint]",
    "pytest>=8.4.2",
    "pytest-cov>=6.2.1",
    "pytest-order>=1.3.0",
    "moto[server,s3]>=5.1.17",
    "s3fs>=2025.10.0",
]
test_core = [
    "octopus-automl",
    "pytest>=8.4.2",
    "pytest-cov>=6.2.1",
]

[project.scripts]
octopus = "octopus.cli:cli_main"

[build-system]
requires = [
    "setuptools>=80.9",
    "setuptools_scm[toml]>=9.2"
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_scheme = 'post-release'
local_scheme = "dirty-tag"

[tool.setuptools.package-dir]
"octopus" = "octopus"
"octopus.examples" = "examples"

[tool.uv]
# licensecheck depends indirectly on attrs<24 but we need attrs>=25.3.0
override-dependencies = ["attrs>=25.3.0"]
# Otherwise uv locks an autogluon nightly build, which pip installs only with `--pre`.
prerelease-package = { autogluon-tabular = "disallow" }

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
show_error_codes = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["docs", "studies"]


# No type information (py.typed or stubs) is available for these packages
[[tool.mypy.overrides]]
module = [
    "autogluon.*",
    "boruta.*",
    "catboost.*",
    "ipywidgets.*",
    "lifelines.*",
    "shap.*",
    "threadpoolctl",
]
ignore_missing_imports = true

[tool.pytest]
testpaths = ["tests"]
markers = ["slow: mark test as slow.", "windows: mark test to run in windows."]
addopts = ["--cov=octopus", "--durations=15"]
tmp_path_retention_policy = "none"
